</head>
<body>
  <a class="skip" href="#main">Məzmuna keç</a>
  <header class="site-header">
    <nav class="studio-navigation wrap" aria-label="Əsas menyu">
      <a class="brand studio-nav-brand" href="./" aria-label="SSL School · Ana səhifə">
        <img class="wordmark" src="./assets/wordmark.png" alt="" width="576" height="120">
      </a>
      <button class="studio-menu-toggle" type="button" aria-controls="studio-nav-links" aria-expanded="false" aria-label="Menyunu aç">
        <span class="studio-menu-icon" aria-hidden="true">
          <img src="./assets/roadmap-icons/menu-top.svg" alt="" width="30" height="7">
          <img src="./assets/roadmap-icons/menu-middle.svg" alt="" width="30" height="7">
          <img src="./assets/roadmap-icons/menu-bottom.svg" alt="" width="30" height="7">
        </span>
      </button>
      <div class="studio-nav-links" id="studio-nav-links">
        <div class="studio-nav-group studio-nav-left">
          <a href="./#reyler" class="nav-reviews" lang="en">Reviews</a>
          <a href="./#dersin-gedisi" class="nav-roadmap yellow-underline">Yol xəritəsi</a>
          <a href="./#ustunlukler" class="nav-benefits" lang="en">Benefits</a>
          <a href="./#suallar" class="nav-faq" lang="en">FAQ</a>
        </div>
        <div class="studio-nav-group studio-nav-right">
          <a href="./?page=kurslar" data-nav="kurslar" class="nav-courses" lang="en">Courses</a>
          <a href="./#elaqe" class="nav-contact" lang="en">Consultation</a>
        </div>
      </div>
    </nav>
  </header>
  <main id="main" class="wrap" tabindex="-1">
    <noscript>İnteraktiv dərsi və kursları görmək üçün JavaScript-i aktiv et.</noscript>
  </main>
  <footer class="site-footer wrap">
    <div class="footer-brand">
      <a class="brand" href="./" aria-label="SSL School · Ana səhifə">
        <img class="brand-mark" src="./assets/logo.png" alt="" width="63" height="36">
        <img class="wordmark" src="./assets/wordmark.png" alt="SSL School" width="103" height="25">
      </a>
      <p>Fərdi onlayn ingilis dili dərsləri</p>
    </div>
  </footer>
