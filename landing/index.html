  <style>
    /* Page loader: visible from the first paint, faded out once the page has loaded. */
    .page-loader { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #08060d; font-family: Manrope, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .4s ease, visibility .4s; }
    .page-loader.is-done { opacity: 0; visibility: hidden; }
    .page-loader-stage { position: relative; width: 154px; height: 150px; display: flex; align-items: flex-end; justify-content: center; }
    .page-loader-mascot { width: 96px; height: 132px; margin-bottom: 4px; background: url(./assets/mascot-loader.png) center / contain no-repeat; transform-origin: 50% 100%; animation: page-loader-float 1.5s ease-in-out infinite; }
    .page-loader-shadow { position: absolute; bottom: 0; width: 86px; height: 12px; border-radius: 50%; background: #000; box-shadow: 0 0 10px #000; animation: page-loader-shadow 1.5s ease-in-out infinite; }
    .page-loader-label { display: flex; align-items: flex-end; gap: 4px; color: #f9efff; font-size: 18px; font-weight: 700; letter-spacing: .6px; }
    .page-loader-label span { margin-right: 2px; }
    .page-loader-label i { width: 7px; height: 7px; margin-bottom: 5px; border-radius: 50%; animation: page-loader-dot 1.26s ease-in-out infinite; }
    .page-loader-label i:nth-of-type(1) { background: #a49dff; }
    .page-loader-label i:nth-of-type(2) { background: #f39a7b; animation-delay: .14s; }
    .page-loader-label i:nth-of-type(3) { background: #f5c84c; animation-delay: .28s; }
    @keyframes page-loader-float {
      0%, 100% { transform: translateY(0) scale(1.02, .98) rotate(0); }
      25% { transform: translateY(-7px) rotate(-2deg); }
      50% { transform: translateY(-14px) rotate(0); }
      75% { transform: translateY(-7px) rotate(2deg); }
    }
    @keyframes page-loader-shadow { 0%, 100% { opacity: .55; transform: scaleX(1); } 50% { opacity: .3; transform: scaleX(.8); } }
    @keyframes page-loader-dot { 0%, 33%, 100% { transform: translateY(0); } 16% { transform: translateY(-7px); } }
    @media (prefers-reduced-motion: reduce) { .page-loader-mascot, .page-loader-shadow, .page-loader-label i { animation: none; } }
  </style>

  <div class="page-loader" id="page-loader" role="progressbar" aria-label="Loading" aria-busy="true">
    <div class="page-loader-stage"><div class="page-loader-shadow"></div><div class="page-loader-mascot"></div></div>
    <div class="page-loader-label" aria-hidden="true"><span>Loading</span><i></i><i></i><i></i></div>
  </div>
  <script>
    (function () {
      var loader = document.getElementById('page-loader');
      var done = false;
      function hide() {
        if (done) return;
        done = true;
        loader.classList.add('is-done');
        loader.removeAttribute('aria-busy');
        setTimeout(function () { loader.remove(); }, 450);
      }
      if (document.readyState === 'complete') hide();
      else window.addEventListener('load', hide);
      // Never keep visitors waiting on a slow image or font: give up after the page is usable for a few seconds.
      document.addEventListener('DOMContentLoaded', function () { setTimeout(hide, 4000); });
      // Coming back via the browser's back button restores the page without a new load event.
      window.addEventListener('pageshow', function (e) { if (e.persisted) hide(); });
    })();
  </script>
