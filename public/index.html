<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>SSL School</title>
    <meta name="description" content="Learn academic, general, and technical English at SSL School. Build critical thinking through language with individual online lessons." />
    <link rel="icon" type="image/png" sizes="192x192" href="/ssl-school-favicon.png" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="192x192" href="/ssl-school-favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sslschool.az/" />
    <meta property="og:title" content="SSL School" />
    <meta property="og:description" content="Learn academic, general, and technical English at SSL School. Build critical thinking through language with individual online lessons." />
    <meta property="og:image" content="https://sslschool.az/ssl-school-logo-preview.png?v=2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SSL School logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SSL School" />
    <meta name="twitter:description" content="Learn academic, general, and technical English at SSL School. Build critical thinking through language with individual online lessons." />
    <meta name="twitter:image" content="https://sslschool.az/ssl-school-logo-preview.png?v=2" />
    <meta name="twitter:image:alt" content="SSL School logo" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SSL School",
        "url": "https://sslschool.az/",
        "logo": "https://sslschool.az/ssl-school-favicon.png"
      }
    </script>
    <style id="expo-reset">
      html, body, #root { height: 100%; }
      body { overflow: hidden; }
      #root { display: flex; flex: 1; }
      /* Shown until the app script mounts and replaces #root's contents. Matches mobile/MascotLoader.tsx. */
      body { margin: 0; background: #272727; }
      .boot { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .boot-stage { position: relative; width: 154px; height: 150px; display: flex; align-items: flex-end; justify-content: center; }
      .boot-mascot { width: 96px; height: 132px; margin-bottom: 4px; background: url(/mascot-loader.png) center / contain no-repeat; transform-origin: 50% 100%; animation: boot-float 1.5s ease-in-out infinite; }
      .boot-shadow { position: absolute; bottom: 0; width: 86px; height: 12px; border-radius: 50%; background: #000; animation: boot-shadow 1.5s ease-in-out infinite; }
      .boot-label { display: flex; align-items: flex-end; gap: 4px; color: #f5f5f3; font-size: 18px; font-weight: 700; letter-spacing: .6px; }
      .boot-label span { margin-right: 2px; }
      .boot-label i { width: 7px; height: 7px; margin-bottom: 5px; border-radius: 50%; animation: boot-dot 1.26s ease-in-out infinite; }
      .boot-label i:nth-of-type(1) { background: #a49dff; }
      .boot-label i:nth-of-type(2) { background: #f39a7b; animation-delay: .14s; }
      .boot-label i:nth-of-type(3) { background: #f5c84c; animation-delay: .28s; }
      @keyframes boot-float {
        0%, 100% { transform: translateY(0) scale(1.02, .98) rotate(0); }
        25% { transform: translateY(-7px) scale(1, 1) rotate(-2deg); }
        50% { transform: translateY(-14px) scale(1, 1) rotate(0); }
        75% { transform: translateY(-7px) scale(1, 1) rotate(2deg); }
      }
      @keyframes boot-shadow { 0%, 100% { opacity: .4; transform: scaleX(1); } 50% { opacity: .24; transform: scaleX(.8); } }
      @keyframes boot-dot { 0%, 33%, 100% { transform: translateY(0); } 16% { transform: translateY(-7px); } }
      @media (prefers-reduced-motion: reduce) { .boot-mascot, .boot-shadow, .boot-label i { animation: none; } }
    </style>
    <link rel="preload" as="image" href="/mascot-loader.png" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="boot" role="progressbar" aria-label="Opening SSL School" aria-busy="true">
        <div class="boot-stage"><div class="boot-shadow"></div><div class="boot-mascot"></div></div>
        <div class="boot-label" aria-hidden="true"><span>Loading</span><i></i><i></i><i></i></div>
      </div>
    </div>
  </body>
</html>
